name: Quality

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        command: mongod --replSet rs0 --bind_ip 0.0.0.0
        options: >-
          --health-cmd "mongosh --quiet --eval 'try { const s = rs.status(); if (s.members[0].stateStr === \"PRIMARY\") { quit(0) } } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"127.0.0.1:27017\"}]}) } quit(1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    env:
      JANUS_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      JANUS_MONGODB_DATABASE: janus
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install web dependencies
        run: bun install --cwd apps/web --frozen-lockfile
      - name: Configure git identity for tests
        run: |
          git config --global user.email "janus-ci@example.invalid"
          git config --global user.name "Janus CI"
      - name: Quality checks
        run: cargo xtask check
