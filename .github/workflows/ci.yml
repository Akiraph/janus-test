name: Docker

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - ".github/**"
  push:
    branches: [main, master, dev]
    paths-ignore:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    name: Docker Build Verification (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [combined, server, web]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          BUILDKIT_MEM_LIMIT: 13g
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: false
          tags: janus:${{ matrix.target }}-pr-check
          cache-from: |
            type=gha
          cache-to: |
            type=gha,mode=max

      - name: Verify build success
        run: |
          echo "Docker image target '${{ matrix.target }}' build completed successfully."
          echo "Platform: linux/amd64"

  publish-amd64:
    name: Publish Docker (amd64) — ${{ matrix.label }}
    if: >
      github.event_name != 'pull_request' &&
      (
        github.actor == 'SynapticArch' ||
        github.actor == 'actions-user' ||
        github.actor == 'Chloemlla'
      ) &&
      !contains(github.event.head_commit.message || '', 'deps):')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: combined
            target: combined
            suffix: "-combined"
          - label: server
            target: server
            suffix: "-server"
          - label: web
            target: web
            suffix: "-web"
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Compute metadata
        id: meta
        run: |
          # Registry paths must be lowercase; GITHUB_REPOSITORY keeps the owner's casing.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "ref_tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Prepare tags
        id: tags
        run: |
          SUFFIX='${{ matrix.suffix }}'
          TAGS=$(cat <<EOF
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.ref_tag }}${SUFFIX}-amd64
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}${SUFFIX}-amd64
          EOF
          )

          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Packages
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare buildx cache dirs
        run: |
          mkdir -p /tmp/.buildx-cache
          mkdir -p /tmp/.buildx-cache-new

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          BUILDKIT_MEM_LIMIT: 13g
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: |
            type=local,src=/tmp/.buildx-cache
            type=gha
            type=registry,ref=${{ steps.meta.outputs.image }}:cache
          cache-to: |
            type=local,dest=/tmp/.buildx-cache-new,mode=max
            type=gha,mode=max
            type=registry,ref=${{ steps.meta.outputs.image }}:cache,mode=max
          tags: ${{ steps.tags.outputs.tags }}

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy-amd64:
    name: Deploy AMD64 image (${{ matrix.label }})
    needs: publish-amd64
    if: >
      github.event_name != 'pull_request' &&
      (
        github.actor == 'SynapticArch' ||
        github.actor == 'actions-user' ||
        github.actor == 'Chloemlla'
      ) &&
      needs['publish-amd64'].result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend and frontend run on separate servers; every deployment
          # variable is its own secret. Frontend uses the *_WEB suffixed
          # secrets, backend the unprefixed ones.
          - label: backend
            suffix: "-server"
            server_secret: SERVER_ADDRESS
            username_secret: USERNAME
            port_secret: PORT
            key_secret: PRIVATE_KEY
            containers_secret: CONTAINER_NAMES
            admin_secret: ADMIN_PASSWORD
          - label: frontend
            suffix: "-web"
            server_secret: SERVER_ADDRESS_WEB
            username_secret: USERNAME_WEB
            port_secret: PORT_WEB
            key_secret: PRIVATE_KEY_WEB
            containers_secret: CONTAINER_NAMES_WEB
            admin_secret: ADMIN_PASSWORD_WEB
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install deployment dependencies
        run: npm install --prefix scripts --ignore-scripts --no-audit --fund=false

      - name: Set script permissions
        run: chmod +x scripts/deploy_image.js

      - name: Compute image tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run deployment script
        env:
          IMAGE_URL: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.short_sha }}${{ matrix.suffix }}-amd64
          SERVER_ADDRESS: ${{ secrets[matrix.server_secret] }}
          USERNAME: ${{ secrets[matrix.username_secret] }}
          PORT: ${{ secrets[matrix.port_secret] }}
          PRIVATE_KEY: ${{ secrets[matrix.key_secret] }}
          CONTAINER_NAMES: ${{ secrets[matrix.containers_secret] }}
          ADMIN_PASSWORD: ${{ secrets[matrix.admin_secret] }}
        run: node scripts/deploy_image.js
